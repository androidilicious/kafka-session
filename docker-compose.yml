# Kafka broker (KRaft mode, no ZooKeeper), topic setup, and a web UI.
#
#   docker compose up -d                          Kafka + UI only (run scripts on your laptop)
#   docker compose --profile apps up -d --build   also run producer + fraud detector in containers
#   docker compose --profile apps down -v         stop everything and wipe the data

services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two client listeners: one for other containers (kafka:29092),
      # one for scripts on your laptop (localhost:9092).
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Single broker, so every internal topic gets one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  # Runs once: waits for the broker, creates the three topics, then exits.
  kafka-init:
    image: apache/kafka:4.1.0
    container_name: kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        K=/opt/kafka/bin/kafka-topics.sh
        until $$K --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
          echo "waiting for kafka..."; sleep 2
        done
        for t in transactions fraud-alerts fraud-reviews; do
          $$K --bootstrap-server kafka:29092 --create --if-not-exists --topic $$t --partitions 3
        done
        echo "topics ready"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"

  # Optional: the Python apps as containers. Inside the Docker network the
  # broker address is kafka:29092, passed in as an environment variable.
  producer:
    build: .
    profiles: ["apps"]
    command: ["python", "producer.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  fraud-detector:
    build: .
    profiles: ["apps"]
    command: ["python", "fraud_detector.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
